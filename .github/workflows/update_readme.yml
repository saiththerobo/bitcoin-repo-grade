name: Update Bitcoin Repo Grade README

on:
  # Triggers whenever code is pushed to main
  push:
    branches:
      - main
  # Triggers automatically every day at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allows manual triggers from the GitHub Actions UI
  workflow_dispatch:

# Grants write access to commit README changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Headless Browser
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 playwright
          playwright install chromium --with-deps

      - name: Generate README
        run: |
          python generate_readme.py
          
      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: auto-update README repo grades"
            git pull --rebase origin main
            git push origin main
          fi
